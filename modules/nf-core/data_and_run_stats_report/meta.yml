name: "data_and_run_stats_report"
description: Generate a data and run stats report (metadata + BEAST run times) using beast_pype
keywords:
  - metadata
  - report
  - collection dates
  - run times
  - phylogenetics
  - beast_pype
tools:
  - "beast_pype":
      description: "BEAST2 pipeline utilities for diagnostics and reporting"
      homepage: "https://pypi.org/project/beast-pype/"
      documentation: "https://pypi.org/project/beast-pype/"
      licence: ["GPL-2.0"]
      identifier: "beast_pype"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'run1' ]`
    - raw_metadata:
        type: file
        description: Raw Pathoplexus metadata file (.csv or .tsv).
        pattern: "*.{csv,tsv}"
    - filtered_metadata:
        type: file
        description: Metadata file after outliers removed in iterative_treetime (.csv or .tsv).
        pattern: "*.{csv,tsv}"
    - pathoplexus_timestamp:
        type: file
        description: File containing the Pathoplexus fetch timestamp.
        pattern: "*.txt"
    - beast_models:
        type: list
        description: List of BEAST model names.
    - beast_outs:
        type: file
        description: BEAST .out screen-log files (named model__run.out).
        pattern: "*.out"
output:
  - html:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'run1' ]`
      - "*_data_and_run_stats_report.html":
          type: file
          description: HTML data and run stats report
          pattern: "*_data_and_run_stats_report.html"
  - notebook:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'run1' ]`
      - "*_data_and_run_stats_report.ipynb":
          type: file
          description: Jupyter notebook with data and run stats report
          pattern: "*_data_and_run_stats_report.ipynb"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@mgrunnill"
maintainers:
  - "@mgrunnill"
