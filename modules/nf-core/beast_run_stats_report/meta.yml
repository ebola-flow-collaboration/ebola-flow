name: "beast_run_stats_report"
description: Generate a BEAST run stats report (per-model run times) using beast_pype
keywords:
  - report
  - run times
  - beast
  - phylogenetics
  - beast_pype
tools:
  - "beast_pype":
      description: "BEAST2 pipeline utilities for diagnostics and reporting"
      homepage: "https://pypi.org/project/beast-pype/"
      documentation: "https://pypi.org/project/beast-pype/"
      licence: ["GPL-2.0"]
      identifier: "beast_pype"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'run1' ]`
    - beast_out_models:
        type: list
        description: List of BEAST model names (aligned with beast_out_files).
    - beast_out_files:
        type: file
        description: BEAST .out screen-log files (named model__run.out).
        pattern: "*.out"
output:
  - html:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'run1' ]`
      - "*_beast_run_stats_report.html":
          type: file
          description: HTML BEAST run stats report
          pattern: "*_beast_run_stats_report.html"
  - notebook:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'run1' ]`
      - "*_beast_run_stats_report.ipynb":
          type: file
          description: Jupyter notebook with BEAST run stats report
          pattern: "*_beast_run_stats_report.ipynb"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@mgrunnill"
maintainers:
  - "@mgrunnill"
