name: "metadata_report"
description: Generate a metadata report (collection dates, submission times, geographic locations) using beast_pype
keywords:
  - metadata
  - report
  - collection dates
  - geographic locations
  - phylogenetics
  - beast_pype
tools:
  - "beast_pype":
      description: "BEAST2 pipeline utilities for diagnostics and reporting"
      homepage: "https://pypi.org/project/beast-pype/"
      documentation: "https://pypi.org/project/beast-pype/"
      licence: ["GPL-2.0"]
      identifier: "beast_pype"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'run1' ]`
    - raw_metadata:
        type: file
        description: Raw Pathoplexus metadata file (.csv or .tsv).
        pattern: "*.{csv,tsv}"
    - cleaned_metadata:
        type: file
        description: Metadata file after the clean_metadata step (.csv or .tsv).
        pattern: "*.{csv,tsv}"
    - filtered_metadata:
        type: file
        description: Metadata file after outliers removed in iterative_treetime (.csv or .tsv).
        pattern: "*.{csv,tsv}"
    - pathoplexus_timestamp:
        type: file
        description: File containing the Pathoplexus fetch timestamp.
        pattern: "*.txt"
output:
  - html:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'run1' ]`
      - "*_metadata_report.html":
          type: file
          description: HTML metadata report
          pattern: "*_metadata_report.html"
  - notebook:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'run1' ]`
      - "*_metadata_report.ipynb":
          type: file
          description: Jupyter notebook with metadata report
          pattern: "*_metadata_report.ipynb"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@mgrunnill"
maintainers:
  - "@mgrunnill"
